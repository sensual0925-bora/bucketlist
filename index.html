<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리들의 버킷리스트</title>
<meta name="description" content="친구들과 함께 쓰는 버킷리스트 일기장">
<meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101013" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="버킷리스트">
<meta property="og:title" content="우리들의 버킷리스트">
<meta property="og:description" content="하고 싶은 일, 같이 적고 같이 해요">
<meta property="og:image" content="https://sensual0925-bora.github.io/bucketlist/friends.jpg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 토스 디자인을 참고한 깔끔한 스타일: 흰 캔버스 + 검정 글씨 + 파란 포인트 하나, Pretendard */
:root{
  color-scheme:light dark;
  --bg:#F2F4F6; --card:#FFFFFF; --fill:#F2F4F6; --fill-2:#E5E8EB;
  --ink:#191F28; --ink-2:#4E5968; --ink-3:#8B95A1; --ink-4:#B0B8C1;
  --line:#E5E8EB;
  --blue:#3182F6; --blue-press:#1B64DA; --blue-soft:#E8F3FF; --blue-ink:#1B64DA;
  --red:#F04452; --scrim:rgba(0,0,0,.45);
  --cta:#191F28; --cta-ink:#FFFFFF;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04); --shadow-lg:0 8px 24px rgba(0,0,0,.12);
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#101013; --card:#1D1D22; --fill:#2A2A31; --fill-2:#34343C;
    --ink:#ECECEE; --ink-2:#B4B4BB; --ink-3:#86868F; --ink-4:#5E5E66;
    --line:#2C2C34;
    --blue:#4D8EF7; --blue-press:#3182F6; --blue-soft:#1A2B47; --blue-ink:#8AB6FA;
    --red:#F26B76; --scrim:rgba(0,0,0,.6);
    --cta:#ECECEE; --cta-ink:#101013;
    --shadow-sm:none; --shadow-lg:0 8px 24px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:var(--blue)}
.wrap{max-width:600px;margin:0 auto;padding-inline:max(20px,env(safe-area-inset-left,0px));padding-top:calc(28px + env(safe-area-inset-top,0px));padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}

/* 상단 */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.today{margin:0 0 6px;color:var(--ink-3);font-size:14px;font-weight:500}
h1{margin:0;font-size:28px;font-weight:800;line-height:1.3;letter-spacing:-.03em}
.hello{margin:6px 0 0;color:var(--ink-2);font-size:16px}
.hello button{border:0;background:none;padding:0;color:var(--blue);font-weight:600}
.invite{flex:none;height:36px;padding:0 14px;border-radius:18px;border:0;background:var(--card);color:var(--ink-2);font-size:14px;font-weight:600;box-shadow:var(--shadow-sm)}

/* 우리 다섯 사진 */
.group-photo{margin:24px 0 0;background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--shadow-sm)}
.group-photo img{display:block;width:100%;height:auto;aspect-ratio:1200/922;object-fit:cover;background:var(--fill)}

/* 진행 */
.progress{margin:12px 0 0;background:var(--card);border-radius:20px;padding:20px;box-shadow:var(--shadow-sm)}
.progress-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:var(--ink-3);font-size:14px;font-weight:500}
.progress-line > span:first-child{color:var(--ink-2);font-size:15px;font-weight:600}
.progress-line b{font-size:24px;font-weight:800;color:var(--ink);letter-spacing:-.02em}
.bar{margin-top:12px;height:8px;border-radius:4px;background:var(--fill);overflow:hidden}
.bar > i{display:block;height:100%;width:0;border-radius:4px;background:var(--blue);transition:width .5s cubic-bezier(.2,.8,.2,1)}

/* 탭: 세그먼트 */
.tabs{display:flex;gap:4px;margin:28px 0 12px;padding:4px;background:var(--fill-2);border-radius:14px}
.tab{flex:1;height:38px;border:0;border-radius:10px;background:transparent;color:var(--ink-3);font-size:15px;font-weight:600}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tab .n{margin-left:4px;font-weight:500;color:var(--ink-3)}

/* 목록 */
.list{list-style:none;margin:0;padding:0;background:var(--card);border-radius:20px;box-shadow:var(--shadow-sm);overflow:hidden}
.list:has(> .empty){background:transparent;box-shadow:none}
.card{display:flex;align-items:center;gap:14px;padding:14px 12px 14px 18px;position:relative}
.card + .card::before{content:"";position:absolute;top:0;left:84px;right:18px;height:1px;background:var(--line)}
.sticker{flex:none;width:52px;height:52px;display:grid;place-items:center;border:0;border-radius:16px;background:var(--fill);font-size:28px;line-height:1;padding:0}
.thumb{flex:none;width:52px;height:52px;border:0;border-radius:16px;padding:0;position:relative;background:var(--fill)}
.thumb img{display:block;width:100%;height:100%;object-fit:cover;border-radius:16px}
.thumb .em{position:absolute;right:-6px;bottom:-6px;width:26px;height:26px;border-radius:9px;background:var(--card);display:grid;place-items:center;font-size:15px;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.card-main{flex:1;min-width:0;border:0;background:none;padding:2px 0;text-align:left;display:block}
.card-main > span{display:block}
.c-title{font-size:17px;font-weight:600;line-height:1.4;word-break:keep-all;overflow-wrap:anywhere}
.card.done .c-title{color:var(--ink-3)}
.c-note{margin-top:2px;color:var(--ink-3);font-size:14px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.c-meta{margin-top:4px;display:flex!important;flex-wrap:wrap;align-items:center;gap:2px 8px;color:var(--ink-3);font-size:13px}
.c-done{display:inline-block;background:var(--blue-soft);color:var(--blue-ink);border-radius:6px;padding:0 6px;font-weight:600;font-size:12px;line-height:20px}
.check{flex:none;width:44px;height:44px;display:grid;place-items:center;border:0;background:none;padding:0}
.check i{width:26px;height:26px;border-radius:50%;border:2px solid var(--fill-2);display:grid;place-items:center;transition:background .15s,border-color .15s}
.check svg{width:14px;height:14px;opacity:0;color:#fff}
.card.done .check i{background:var(--blue);border-color:var(--blue)}
.card.done .check svg{opacity:1}
.restore{flex:none;height:34px;padding:0 12px;border-radius:10px;border:0;background:var(--fill);color:var(--ink-2);font-size:14px;font-weight:600}

.empty{text-align:center;color:var(--ink-3);padding:56px 16px;font-size:15px;list-style:none}
.empty b{display:block;font-size:44px;margin-bottom:10px}
.err{background:var(--card);border-radius:16px;padding:16px 18px;color:var(--ink-2);font-size:15px}
.err button{margin-top:10px}

/* 버킷 쓰기 버튼 */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:10;height:56px;padding:0 24px 0 8px;border:0;border-radius:999px;background:var(--cta);color:var(--cta-ink);display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-lg);transition:transform .15s ease}
.fab:active{transform:translateX(-50%) scale(.96)}
.fab-plus{width:40px;height:40px;border-radius:50%;background:var(--blue);display:grid;place-items:center;flex:none}
.fab-plus svg{width:18px;height:18px}
.fab-text{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2}
.fab-text .eng{font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;opacity:.55}
.fab-text b{font-size:16px;font-weight:700}

/* 공통 버튼 */
.btn{height:48px;padding:0 18px;border-radius:14px;border:0;background:var(--fill);color:var(--ink-2);font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:active{background:var(--blue-press)}
.btn.big{width:100%;height:56px;font-size:17px;border-radius:16px}
.btn.small{height:38px;padding:0 14px;font-size:14px;border-radius:10px}
.link{border:0;background:none;padding:4px 0;color:var(--ink-3);font-size:14px;font-weight:500}
.link.danger{color:var(--red)}
.file-btn{cursor:pointer}

/* 시트 */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:24px 24px 0 0;max-height:92dvh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--fill-2);margin:10px auto 0;flex:none}
@media (min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:520px;border-radius:24px;max-height:88vh}
  .sheet::before{display:none}
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 24px 0;flex:none}
.sheet-head h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.x{border:0;background:none;color:var(--ink-3);font-size:15px;font-weight:500;height:40px;padding:0 4px}
.sheet-body{overflow-y:auto;padding:12px 24px 28px;overscroll-behavior:contain}
.field{display:block;margin:0 0 20px}
.field > span{display:block;font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:8px}
.input{width:100%;border:0;background:var(--fill);border-radius:14px;padding:14px 16px;font-size:17px;outline:none;transition:box-shadow .15s}
.input:focus{box-shadow:inset 0 0 0 2px var(--blue)}
.input::placeholder{color:var(--ink-4)}
textarea.input{resize:vertical;min-height:96px;line-height:1.5}
.hint{color:var(--ink-3);margin:0 0 20px;font-size:15px}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .25s cubic-bezier(.2,.8,.2,1)}
  @media (min-width:700px){ .sheet{animation:none} }
}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}

/* 스티커 고르기 */
.pick-top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.pick-top .sticker{width:64px;height:64px;font-size:36px;border-radius:20px}
.pick-top .hint{margin:0;font-size:14px}
.picker{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.picker button{aspect-ratio:1;border:0;border-radius:12px;background:transparent;font-size:24px;line-height:1;padding:0;display:grid;place-items:center}
.picker button[aria-pressed="true"]{background:var(--blue-soft);box-shadow:inset 0 0 0 2px var(--blue)}
@media (max-width:360px){ .picker{grid-template-columns:repeat(6,1fr)} }
.cover-row{display:flex;align-items:center;gap:12px}
.cover-row img{width:56px;height:56px;object-fit:cover;border-radius:14px}

/* 상세 */
.hero{display:flex;justify-content:center;padding:8px 0 4px}
.hero .sticker{width:96px;height:96px;font-size:54px;border-radius:30px}
.photo-card{margin:0;width:100%;position:relative}
.photo-card img{display:block;width:100%;max-height:420px;object-fit:cover;border-radius:18px;background:var(--fill)}
.photo-card figcaption{margin-top:8px;font-size:13px;color:var(--ink-3);text-align:center}
.photo-card .em{position:absolute;left:12px;top:12px;width:44px;height:44px;border-radius:14px;background:var(--card);display:grid;place-items:center;font-size:26px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hero-actions{display:flex;justify-content:center;gap:8px;margin:12px 0 0;flex-wrap:wrap}
.d-date{margin:20px 0 4px;color:var(--ink-3);font-size:14px}
#dInfo h2{margin:0;font-size:24px;font-weight:700;line-height:1.35;letter-spacing:-.02em;word-break:keep-all;overflow-wrap:anywhere}
.d-note{margin:8px 0 0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-size:16px;color:var(--ink-2);line-height:1.6}
.d-meta{margin:10px 0 0;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.d-sec{margin:24px -24px 0;padding:24px 24px 0;border-top:10px solid var(--bg)}
.d-sec h3{margin:0 0 12px;font-size:17px;color:var(--ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{background:var(--fill);color:var(--ink-2);border-radius:999px;padding:6px 14px;font-size:15px;font-weight:500}
.chip.me{background:var(--blue-soft);color:var(--blue-ink);font-weight:600}
.name-chip{border:0;font-size:16px;font-weight:600;padding:10px 18px}
.name-chip.me{box-shadow:inset 0 0 0 2px var(--blue)}
.muted{color:var(--ink-3);font-size:15px}
.join-btn{width:100%}
.join-btn.on{background:var(--blue-soft);color:var(--blue-ink)}
.done-box{background:var(--fill);border-radius:18px;padding:18px}
.done-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.badge{background:var(--blue);color:#fff;border-radius:8px;padding:2px 10px;font-weight:700;font-size:14px}
.done-date{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:15px}
.done-date input{border:0;background:var(--card);border-radius:10px;padding:6px 10px;font-size:15px}
.done-head .link{margin-left:auto}
.done-box .photo-card{margin-top:16px}
.photo-drop{margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px;height:110px;border:2px dashed var(--fill-2);border-radius:16px;background:var(--card);color:var(--ink-3);font-weight:600;cursor:pointer}
.photo-row{margin-top:12px;display:flex;justify-content:center}
.review{margin:16px 0 0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-size:16px;color:var(--ink-2);line-height:1.6}
.review-form{margin-top:14px}
.review-form .input{background:var(--card)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.cmts{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:16px}
.cmt-top{display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--ink-3)}
.cmt-top b{color:var(--ink);font-size:15px;font-weight:600}
.cmt-top .link{margin-left:auto;font-size:13px;padding:0}
.cmt p{margin:2px 0 0;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;font-size:15px;color:var(--ink-2)}
.cmt-form{display:flex;gap:8px}
.cmt-form .input{flex:1;min-width:0;padding:12px 16px}
.cmt-form .btn{height:auto}
.trash-note{background:var(--fill);border-radius:16px;padding:14px 16px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
#dFoot{text-align:center}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(25,31,40,.92);color:#fff;padding:12px 20px;border-radius:14px;z-index:40;font-size:15px;font-weight:500;max-width:calc(100% - 40px);text-align:center;backdrop-filter:blur(8px)}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <p class="today" id="today"></p>
      <h1>우리들의 버킷리스트</h1>
      <p class="hello" id="hello"></p>
    </div>
    <button class="invite" id="inviteBtn" type="button">친구 초대</button>
  </div>
  <figure class="group-photo">
    <img src="friends.jpg" alt="레트로 TV 화면 속 우리 다섯 명" width="1200" height="922">
  </figure>


  <div class="progress" id="progress" hidden>
    <div class="progress-line"><span>함께 이룬 꿈</span><span><b id="doneCount">0</b> / <span id="allCount">0</span>개</span></div>
    <div class="bar"><i id="barFill"></i></div>
  </div>

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="todo">도전 중<span class="n" id="nTodo"></span></button>
    <button class="tab" role="tab" data-tab="done">달성<span class="n" id="nDone"></span></button>
    <button class="tab" role="tab" data-tab="trash">휴지통<span class="n" id="nTrash"></span></button>
  </div>

  <div id="status"></div>
  <ul class="list" id="list"></ul>
</main>

<button class="fab" id="addBtn" type="button">
  <span class="fab-plus" aria-hidden="true"><svg viewBox="0 0 18 18" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"><path d="M9 3v12M3 9h12"/></svg></span>
  <span class="fab-text"><span class="eng">New Bucket</span><b>버킷 쓰기</b></span>
</button>

<div class="scrim" id="scrim" hidden></div>

<!-- 이름 -->
<div class="sheet" id="nameSheet" role="dialog" aria-modal="true" aria-labelledby="nameTitle" hidden>
  <div class="sheet-head"><h2 id="nameTitle">누구신가요?</h2><button class="x" type="button" data-close id="nameClose">닫기</button></div>
  <form class="sheet-body" id="nameForm">
    <p class="hint">버킷을 쓰거나 댓글을 달 때 이 이름이 보여요. 이 기기에 기억해 둘게요.</p>
    <div id="nameChips"></div>
    <label class="field"><span id="nameInputLabel">이름 (친구들이 알아볼 수 있게)</span><input class="input" id="nameInput" maxlength="20" autocomplete="nickname" required></label>
    <button class="btn primary big" type="submit">시작하기</button>
  </form>
</div>

<!-- 추가 -->
<div class="sheet" id="addSheet" role="dialog" aria-modal="true" aria-labelledby="addTitle" hidden>
  <div class="sheet-head"><h2 id="addTitle">새 버킷 쓰기</h2><button class="x" type="button" data-close>닫기</button></div>
  <form class="sheet-body" id="addForm">
    <label class="field"><span>하고 싶은 일</span><input class="input" id="addTitleInput" name="title" maxlength="100" placeholder="예) 제주도 한 바퀴 자전거 여행" required autocomplete="off"></label>
    <label class="field"><span>설명 (선택)</span><textarea class="input" id="addNoteInput" maxlength="1000" placeholder="언제, 누구랑, 왜 하고 싶은지"></textarea></label>
    <div class="field"><span>스티커</span><div id="addPicker"></div></div>
    <div class="field"><span>사진 붙이기 (선택)</span>
      <div class="cover-row"><img id="addCoverPreview" alt="" hidden>
        <label class="btn small file-btn"><span id="addCoverLabel">📷 사진 고르기</span><input type="file" accept="image/*" id="addCover" hidden></label>
        <button class="link" type="button" id="addCoverClear" hidden>빼기</button></div>
    </div>
    <button class="btn primary big" type="submit">추가하기</button>
  </form>
</div>

<!-- 상세 -->
<div class="sheet" id="detailSheet" role="dialog" aria-modal="true" aria-label="버킷 자세히" hidden>
  <div class="sheet-head"><span></span><button class="x" type="button" data-close>닫기</button></div>
  <div class="sheet-body" id="detailBody">
    <section id="dHero"></section>
    <section id="dInfo"></section>
    <section class="d-sec" id="dJoin"></section>
    <section class="d-sec" id="dDone"></section>
    <section class="d-sec">
      <h3>댓글 <span id="dCmtCount"></span></h3>
      <ul class="cmts" id="dComments"></ul>
      <form class="cmt-form" id="cmtForm">
        <input class="input" id="cmtInput" maxlength="500" placeholder="댓글 달기" autocomplete="off" aria-label="댓글">
        <button class="btn primary" type="submit">등록</button>
      </form>
    </section>
    <section class="d-sec" id="dFoot"></section>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script>
(() => {
  /* ===== Supabase 설정 ===== */
  // publishable 키는 웹페이지에 넣어 쓰도록 만든 공개용 키 (secret 키는 절대 넣지 말 것)
  const SUPABASE_URL = "https://pxbbwatboylajmxeqnqd.supabase.co";
  const SUPABASE_KEY = "sb_publishable_fiefZveGsfljQqJH5CJ5Pw_CgmKiaT2";
  const PHOTO_BUCKET = "bucket-photos";
  const PHOTO_MAX = 1600;  // 사진은 긴 변을 이 크기로 줄여서 올림 (무료 저장 용량 1GB 아끼기)
  const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const pad = n => String(n).padStart(2, "0");
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
  const WEEK = "일월화수목금토";
  const fmtDay = s => { if (!s) return ""; const [y, m, d] = s.slice(0, 10).split("-"); return `${y}.${m}.${d}`; };
  const fmtDiary = iso => { const d = new Date(iso); return isNaN(d) ? "" : `${d.getFullYear()}. ${pad(d.getMonth()+1)}. ${pad(d.getDate())} (${WEEK[d.getDay()]})`; };
  const fmtShort = iso => { const d = new Date(iso); return isNaN(d) ? "" : `${d.getMonth()+1}월 ${d.getDate()}일`; };
  const fmtAgo = iso => {
    const d = new Date(iso), s = (Date.now() - d) / 1000;
    if (isNaN(d)) return "";
    if (s < 60) return "방금";
    if (s < 3600) return `${Math.floor(s / 60)}분 전`;
    if (s < 86400) return `${Math.floor(s / 3600)}시간 전`;
    if (s < 86400 * 7) return `${Math.floor(s / 86400)}일 전`;
    return fmtShort(iso);
  };
  const photoUrl = p => `${SUPABASE_URL}/storage/v1/object/public/${PHOTO_BUCKET}/${p.split("/").map(encodeURIComponent).join("/")}`;
  const store = {
    get(k) { try { return localStorage.getItem(k) || ""; } catch { return ""; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  // 이름은 쿠키에도 저장 (카카오톡 안에서 열면 localStorage가 자주 지워져서)
  const cookie = {
    get(k) { const m = document.cookie.match(new RegExp("(?:^|; )" + k + "=([^;]*)")); try { return m ? decodeURIComponent(m[1]) : ""; } catch { return ""; } },
    set(k, v) { document.cookie = `${k}=${encodeURIComponent(v)}; max-age=${60 * 60 * 24 * 400}; path=/; SameSite=Lax`; },
  };
  const CHECK_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13c2 1.5 3.5 3.5 5 6 3-6 7-11 12-15"/></svg>';

  function toast(msg, ms = 2600) {
    const t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, ms);
  }

  /* ===== 일기장 꾸미기: 이모티콘 스티커 ===== */
  // 제목에 들어 있는 낱말로 스티커를 골라 줌 (앞에 있는 줄이 먼저)
  const EMOJI_RULES = `
    오로라,별똥별,유성,은하수,밤하늘:🌌|불꽃놀이,불꽃:🎆|일출,해돋이:🌅|노을,일몰,석양:🌇|별자리,별 보:🌟
    순례,산티아고,산책,걷기,걸어서,트레킹,둘레길,올레:🥾|등산,산행,정상,청계산,북한산,한라산,지리산,설악산,등반:⛰️
    자전거,라이딩:🚲|캠핑,글램핑,텐트:🏕️|낚시:🎣|스키,보드타기:⛷️|서핑:🏄|스쿠버,다이빙,스노클:🤿|수영:🏊
    마라톤,달리기,러닝,조깅:🏃|요가,필라테스:🧘|헬스,운동,근육,바디프로필:💪|스카이다이빙,패러글라이딩,번지:🪂|열기구:🎈
    축구:⚽|야구:⚾|농구:🏀|골프:⛳|테니스:🎾|볼링:🎳|클라이밍:🧗|춤,댄스,발레:💃|노래방,노래,콘서트,공연,페스티벌:🎤
    통기타,기타 배우,기타 치,우쿨렐레:🎸|피아노:🎹|그림,드로잉,수채화:🎨|사진,필름카메라:📷|영화:🎬|뮤지컬,연극:🎭|책,독서,소설:📚|일기,글쓰기,편지:💌
    공부,시험,자격증:✏️|영어,외국어,일본어,중국어,스페인어:🗣️|졸업:🎓|게임:🎮|놀이공원,롤러코스터,에버랜드,롯데월드:🎢
    사우나,찜질방,온천,스파:♨️|치맥,치킨:🍗|맥주,술자리,술 한잔,포차,칵테일:🍻|와인:🍷|커피,카페:☕|빵,베이커리:🥐|케이크,디저트:🍰
    아이스크림:🍦|라면,국수,맛집,먹방:🍜|초밥,스시,오마카세:🍣|고기,바베큐,삼겹살:🥩|피자:🍕|요리,베이킹:🍳
    피크닉,소풍:🧺|한강:🌉|제주,귤:🍊|바다,해변,바닷가:🌊|섬,몰디브,발리,하와이:🏝️|크루즈,유람선,요트:🛳️
    벚꽃,꽃구경,꽃:🌸|단풍,가을:🍁|눈사람,크리스마스,겨울:⛄|숲,나무,캠프파이어:🌲|식물,화분,텃밭:🪴
    강아지,댕댕:🐶|고양이,냥:🐱|동물원,동물:🐾|생일,파티:🎉|결혼,웨딩,프러포즈:💍|이사,집,인테리어:🏡
    드라이브,자동차,운전,면허:🚗|기차,KTX,기차여행:🚆|우주,로켓:🚀|돈,저축,적금,부자:💰|다이어트,샐러드:🥗|봉사,기부:🤝
    쇼핑:🛍️|뜨개,뜨개질:🧶|도자기,공방:🏺|가족,엄마,아빠,부모님:👨‍👩‍👧|친구,우정:👯|데이트,연애,사랑:💕
    일본,도쿄,오사카,후쿠오카:🗾|파리,에펠탑:🗼|유럽,런던,스위스,이탈리아:🏰|미국,뉴욕:🗽|비행기,해외,세계일주,유학:✈️|여행,배낭:🧳`
    .trim().split(/[|\n]/).map(s => s.trim()).filter(Boolean).map(s => {
      const i = s.lastIndexOf(":"); return [s.slice(0, i).split(",").map(k => k.trim().toLowerCase()), s.slice(i + 1)];
    });
  const CUTE = ["🌈", "⭐", "🍀", "🌷", "🦋", "🌙", "🎈", "✨"];
  const PICKS = ["✈️","🧳","🌊","🏝️","⛰️","🥾","🏕️","🚲","🌌","🌸","🍁","⛄","🍗","🍻","☕","🍰","🍜","🎤","🎬","🎨","📷","📚","💪","🎢","🎮","💌","🎉","🐶","🏡","💰","🌈","✨"];
  function guessEmoji(title, seed = 0) {
    const t = String(title || "").toLowerCase();
    for (const [keys, e] of EMOJI_RULES) if (keys.some(k => k && t.includes(k))) return e;
    return CUTE[Math.abs(seed) % CUTE.length];
  }
  const hash = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.codePointAt(0)) | 0; return Math.abs(h); };
  const emojiOf = i => i.emoji || guessEmoji(i.title, hash(i.title));

  function pickerHtml(selected, suggested) {
    const list = [suggested, ...PICKS.filter(e => e !== suggested)];
    if (selected && !list.includes(selected)) list.unshift(selected);
    return `<div class="picker" role="group" aria-label="스티커 고르기">${list.map(e =>
      `<button type="button" data-emoji="${esc(e)}" aria-pressed="${e === selected}">${esc(e)}</button>`).join("")}</div>`;
  }

  /* ===== 상태 ===== */
  let me = store.get("bucket.name") || cookie.get("bucket_name");
  if (me) { store.set("bucket.name", me); cookie.set("bucket_name", me); }
  let tab = ["todo", "done", "trash"].includes(store.get("bucket.tab")) ? store.get("bucket.tab") : "todo";
  let items = [], joins = [], comments = [];
  let loaded = false, loadError = "";
  let openId = null;            // 상세 시트에 열려 있는 항목
  let editInfo = false, editReview = false, uploading = "";   // uploading: "", "cover", "photo"

  const byId = id => items.find(i => i.id === id);
  const joinsOf = id => joins.filter(j => j.item_id === id);
  const commentsOf = id => comments.filter(c => c.item_id === id);

  /* ===== 불러오기 ===== */
  let loadSeq = 0;
  async function load() {
    if (!sb) { loadError = "Supabase 연결 파일을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요."; render(); return; }
    const seq = ++loadSeq;
    const [a, b, c] = await Promise.all([
      sb.from("bucket_items").select("*").order("created_at", { ascending: false }),
      sb.from("bucket_joins").select("*").order("created_at"),
      sb.from("bucket_comments").select("*").is("deleted_at", null).order("created_at"),
    ]);
    if (seq !== loadSeq) return;  // 더 최근 요청이 있으면 그 결과를 씀
    const err = a.error || b.error || c.error;
    if (err) { loadError = "목록을 불러오지 못했어요. (" + err.message + ")"; render(); return; }
    items = a.data; joins = b.data; comments = c.data;
    loaded = true; loadError = "";
    render();
    if (openId != null) renderDetail();
  }
  let loadTimer = null;
  const loadSoon = () => { clearTimeout(loadTimer); loadTimer = setTimeout(load, 300); };

  // 저장 공통: 실패하면 알리고, 성공하면 다시 불러옴
  async function save(query, okMsg) {
    const { error } = await query;
    if (error) { toast("저장하지 못했어요. (" + error.message + ")", 4500); return false; }
    if (okMsg) toast(okMsg);
    await load();
    return true;
  }
  async function busy(btn, fn) {
    if (btn) btn.disabled = true;
    try { return await fn(); } finally { if (btn) btn.disabled = false; }
  }
  // 글을 남길 때만 이름을 물어봄. 이름을 정하면 하던 화면으로 돌아감
  let afterName = null;
  function needName(then) {
    if (me) return false;
    const back = openId;
    afterName = then || (back != null ? () => openSheet("detail", back) : null);
    openSheet("name");
    return true;
  }
  function setName(v) {
    me = v; store.set("bucket.name", v); cookie.set("bucket_name", v);
    const then = afterName; afterName = null;
    closeSheet(); render();
    toast(`반가워요, ${v}님!`);
    if (then) then();
  }
  // 지금까지 글을 남긴 이름들을 버튼으로 보여 줌 (많이 쓴 순)
  function renderNameChips() {
    const count = {};
    [...items.map(i => i.author), ...joins.map(j => j.name), ...comments.map(c => c.author)]
      .forEach(n => { if (n) count[n] = (count[n] || 0) + 1; });
    const names = Object.keys(count).sort((a, b) => count[b] - count[a]).slice(0, 12);
    $("#nameChips").innerHTML = names.length ? `
      <div class="field"><span>이 중에 있나요? 눌러서 고르세요</span>
        <div class="chips">${names.map(n => `<button type="button" class="chip name-chip${n === me ? " me" : ""}" data-name="${esc(n)}">${esc(n)}</button>`).join("")}</div></div>` : "";
    $("#nameInputLabel").textContent = names.length ? "처음이라면 이름을 적어 주세요" : "이름 (친구들이 알아볼 수 있게)";
  }

  /* ===== 목록 그리기 ===== */
  function render() {
    $("#today").textContent = fmtDiary(new Date());
    $("#hello").innerHTML = me
      ? `<button type="button" id="nameBtn">${esc(me)}</button>님, 오늘은 어떤 꿈을 적어 볼까요?`
      : `친구들과 하고 싶은 일을 함께 적어요 · <button type="button" id="nameBtn">내 이름 정하기</button>`;
    const live = items.filter(i => !i.deleted_at);
    const done = live.filter(i => i.done);
    const trash = items.filter(i => i.deleted_at);
    $("#progress").hidden = !loaded || !live.length;
    $("#doneCount").textContent = done.length;
    $("#allCount").textContent = live.length;
    $("#barFill").style.width = live.length ? (done.length / live.length * 100) + "%" : "0";
    $("#nTodo").textContent = loaded ? live.length - done.length : "";
    $("#nDone").textContent = loaded ? done.length : "";
    $("#nTrash").textContent = loaded && trash.length ? trash.length : "";
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === tab));
    $("#addBtn").hidden = tab === "trash";

    const status = $("#status"), list = $("#list");
    if (loadError) {
      status.innerHTML = `<div class="err">${esc(loadError)}<br><button class="btn small" type="button" id="retryBtn">다시 시도</button></div>`;
      if (!loaded) { list.innerHTML = ""; return; }
    } else status.innerHTML = loaded ? "" : `<p class="empty">불러오는 중…</p>`;
    if (!loaded) { list.innerHTML = ""; return; }

    let rows;
    if (tab === "todo") rows = live.filter(i => !i.done);
    else if (tab === "done") rows = done.slice().sort((x, y) => (y.done_at || "").localeCompare(x.done_at || "") || y.created_at.localeCompare(x.created_at));
    else rows = trash.slice().sort((x, y) => y.deleted_at.localeCompare(x.deleted_at));

    if (!rows.length) {
      list.innerHTML = `<li class="empty">${
        tab === "todo" ? (live.length ? "<b>🎉</b>모두 이뤘어요! 새로운 꿈을 적어 볼까요?" : "<b>🪄</b>아직 버킷이 없어요.<br>아래 <strong>버킷 쓰기</strong>로 첫 번째 꿈을 적어 보세요.")
        : tab === "done" ? "<b>🌱</b>아직 달성한 버킷이 없어요.<br>하나씩 이뤄 봐요!"
        : "휴지통이 비어 있어요."}</li>`;
      return;
    }
    list.innerHTML = rows.map(cardHtml).join("");
  }

  // 카드 왼쪽 그림: 인증 사진 > 붙인 사진 > 이모티콘 스티커
  function artHtml(i) {
    const pic = (i.done && i.photo_path) || i.cover_path;
    if (pic) return `<button class="thumb" type="button" data-act="open" aria-label="${esc(i.title)} 자세히"><img src="${esc(photoUrl(pic))}" alt="" loading="lazy"><span class="em">${esc(emojiOf(i))}</span></button>`;
    return `<button class="sticker" type="button" data-act="open" aria-label="${esc(i.title)} 자세히">${esc(emojiOf(i))}</button>`;
  }

  function cardHtml(i) {
    const nJoin = joinsOf(i.id).length, nCmt = commentsOf(i.id).length;
    const meta = [
      `<span>${esc(i.author)}</span>`,
      i.done ? `<span class="c-done">${esc(fmtDay(i.done_at))} 달성</span>` : `<span>${esc(fmtShort(i.created_at))}</span>`,
      nJoin ? `<span>🙋 ${nJoin}</span>` : "",
      nCmt ? `<span>💬 ${nCmt}</span>` : "",
      i.deleted_at ? `<span>${esc(i.deleted_by || "누군가")}님이 ${esc(fmtAgo(i.deleted_at))} 지움</span>` : "",
    ].join("");
    const main = `<button class="card-main" type="button" data-act="open">
        <span class="c-title">${esc(i.title)}</span>
        ${i.note ? `<span class="c-note">${esc(i.note)}</span>` : ""}
        <span class="c-meta">${meta}</span>
      </button>`;
    const head = `<li class="card${i.done ? " done" : ""}${i.deleted_at ? " trash" : ""}" data-id="${i.id}">${artHtml(i)}${main}`;
    if (i.deleted_at) return `${head}<button class="restore" type="button" data-act="restore">되살리기</button></li>`;
    return `${head}
      <button class="check" type="button" data-act="check" aria-pressed="${i.done}" aria-label="${i.done ? "달성 취소" : "달성 표시"}"><i>${CHECK_SVG}</i></button>
    </li>`;
  }

  /* ===== 상세 그리기 ===== */
  function renderDetail() {
    const i = byId(openId);
    if (!i) { closeSheet(); return; }
    const deleted = !!i.deleted_at;

    const file = act => `<input type="file" accept="image/*" data-act="${act}" hidden>`;
    $("#dHero").innerHTML = `
      <div class="hero">${uploading === "cover"
        ? `<figure class="photo-card"><div class="photo-drop" style="margin:0;height:200px">사진 붙이는 중…</div></figure>`
        : i.cover_path
        ? `<figure class="photo-card"><a href="${esc(photoUrl(i.cover_path))}" target="_blank" rel="noopener"><img src="${esc(photoUrl(i.cover_path))}" alt="${esc(i.title)} 사진"></a><span class="em">${esc(emojiOf(i))}</span></figure>`
        : `<span class="sticker" role="img" aria-label="스티커">${esc(emojiOf(i))}</span>`}</div>
      ${deleted ? "" : `<div class="hero-actions">
        <label class="btn small file-btn">📷 ${i.cover_path ? "사진 바꾸기" : "사진 붙이기"}${file("cover")}</label>
        ${i.cover_path ? `<button class="btn small" type="button" data-act="uncover">사진 떼기</button>` : ""}
      </div>`}`;

    if (!editInfo) {
      $("#dInfo").innerHTML = `
        <p class="d-date">${esc(fmtDiary(i.created_at))} · ${esc(i.author)}</p>
        <h2>${esc(i.title)}</h2>
        ${i.note ? `<p class="d-note">${esc(i.note)}</p>` : ""}
        ${deleted ? "" : `<p class="d-meta"><button class="link" type="button" data-act="edit">✏️ 고치기 · 스티커 바꾸기</button></p>`}`;
    }

    const js = joinsOf(i.id), joined = js.some(j => j.name === me);
    $("#dJoin").innerHTML = `
      <h3>함께하고 싶은 사람 ${js.length ? js.length + "명" : ""}</h3>
      ${js.length ? `<div class="chips">${js.map(j => `<span class="chip${j.name === me ? " me" : ""}">${esc(j.name)}</span>`).join("")}</div>`
                  : `<p class="muted" style="margin:0 0 12px">아직 없어요. 같이 하고 싶다면 손을 들어 주세요!</p>`}
      ${deleted ? "" : `<button class="btn join-btn${joined ? " on" : ""}" type="button" data-act="join">${joined ? "✓ 나도 함께해요 (취소하기)" : "🙋 나도 할래"}</button>`}`;

    if (!editReview) {
      const dDone = $("#dDone");
      if (!i.done) {
        dDone.innerHTML = deleted ? `<p class="muted" style="margin:0">아직 달성하지 않은 버킷이에요.</p>`
          : `<button class="btn primary big" type="button" data-act="done">🎉 달성했어요!</button>`;
      } else {
        dDone.innerHTML = `
          <div class="done-box">
            <div class="done-head">
              <span class="badge">달성</span>
              <label class="done-date">달성한 날 <input type="date" data-act="date" value="${esc(i.done_at || "")}" max="${today()}" ${deleted ? "disabled" : ""}></label>
              ${deleted ? "" : `<button class="link" type="button" data-act="undone">달성 취소</button>`}
            </div>
            ${uploading === "photo" ? `<div class="photo-drop">사진 올리는 중…</div>`
              : i.photo_path ? `<figure class="photo-card"><a href="${esc(photoUrl(i.photo_path))}" target="_blank" rel="noopener"><img src="${esc(photoUrl(i.photo_path))}" alt="인증 사진"></a>
                  <figcaption>${esc(fmtDay(i.done_at))} 인증 사진</figcaption></figure>
                  ${deleted ? "" : `<div class="photo-row"><label class="btn small file-btn">사진 바꾸기${file("photo")}</label></div>`}`
              : deleted ? "" : `<label class="photo-drop">📷 인증 사진 올리기${file("photo")}</label>`}
            ${i.done_note ? `<p class="review">${esc(i.done_note)}</p>` : ""}
            ${deleted ? "" : `<div class="row" style="justify-content:flex-start"><button class="link" type="button" data-act="review">${i.done_note ? "후기 고치기" : "✏️ 후기 남기기"}</button></div>`}
          </div>`;
      }
    }

    const cs = commentsOf(i.id);
    $("#dCmtCount").textContent = cs.length ? cs.length : "";
    $("#dComments").innerHTML = cs.length ? cs.map(c => `
      <li class="cmt" data-cid="${c.id}">
        <div class="cmt-top"><b>${esc(c.author)}</b><span>${esc(fmtAgo(c.created_at))}</span>
          ${c.author === me ? `<button class="link" type="button" data-act="delcmt">삭제</button>` : ""}</div>
        <p>${esc(c.body)}</p>
      </li>`).join("") : `<li class="muted">첫 댓글을 남겨 보세요.</li>`;

    $("#dFoot").innerHTML = deleted
      ? `<div class="trash-note"><span>휴지통에 있는 버킷이에요.</span><button class="btn small" type="button" data-act="restore">되살리기</button></div>`
      : `<button class="link danger" type="button" data-act="trash">휴지통으로 보내기</button>`;
  }

  function infoForm(i) {
    const cur = emojiOf(i);
    $("#dInfo").innerHTML = `
      <form id="infoForm">
        <label class="field"><span>하고 싶은 일</span><input class="input" name="ititle" maxlength="100" required value="${esc(i.title)}"></label>
        <label class="field"><span>설명</span><textarea class="input" name="inote" maxlength="1000">${esc(i.note || "")}</textarea></label>
        <div class="field"><span>스티커</span>${pickerHtml(cur, guessEmoji(i.title, hash(i.title)))}</div>
        <input type="hidden" name="iemoji" value="${esc(cur)}">
        <div class="row"><button class="btn small" type="button" data-act="cancel-edit">취소</button><button class="btn small primary" type="submit">저장</button></div>
      </form>`;
    $("#infoForm").elements.ititle.focus();
  }
  function reviewForm(i) {
    $("#dDone").querySelector(".done-box").insertAdjacentHTML("beforeend", `
      <form class="review-form" id="reviewForm">
        <textarea class="input" name="note" maxlength="1000" placeholder="해 보니 어땠나요?">${esc(i.done_note || "")}</textarea>
        <div class="row"><button class="btn small" type="button" data-act="cancel-review">취소</button><button class="btn small primary" type="submit">저장</button></div>
      </form>`);
    const box = $("#dDone"), old = box.querySelector(".review"), btnRow = box.querySelector("[data-act=review]");
    if (old) old.hidden = true;
    if (btnRow) btnRow.parentElement.hidden = true;
    $("#reviewForm").elements.note.focus();
  }

  /* ===== 버킷 쓰기: 스티커 추천 + 사진 ===== */
  let addEmoji = "", addEmojiPicked = false, addCoverFile = null, addCoverUrl = "";
  function renderAddPicker() {
    const title = $("#addTitleInput").value;
    const suggested = guessEmoji(title, hash(title));
    if (!addEmojiPicked) addEmoji = suggested;
    $("#addPicker").innerHTML = `
      <div class="pick-top"><span class="sticker">${esc(addEmoji)}</span>
        <p class="hint">${addEmojiPicked ? "직접 고른 스티커예요." : "제목에 맞춰 골라 봤어요. 다른 걸 눌러 바꿀 수 있어요."}</p></div>
      ${pickerHtml(addEmoji, suggested)}`;
  }
  function setAddCover(file) {
    if (addCoverUrl) URL.revokeObjectURL(addCoverUrl);
    addCoverFile = file; addCoverUrl = file ? URL.createObjectURL(file) : "";
    $("#addCoverPreview").hidden = !file;
    if (file) $("#addCoverPreview").src = addCoverUrl;
    $("#addCoverClear").hidden = !file;
    $("#addCoverLabel").textContent = file ? "📷 다른 사진" : "📷 사진 고르기";
  }
  $("#addTitleInput").addEventListener("input", renderAddPicker);
  $("#addPicker").addEventListener("click", e => {
    const b = e.target.closest("[data-emoji]"); if (!b) return;
    addEmoji = b.dataset.emoji; addEmojiPicked = true; renderAddPicker();
  });
  $("#addCover").addEventListener("change", e => { if (e.target.files[0]) setAddCover(e.target.files[0]); e.target.value = ""; });
  $("#addCoverClear").addEventListener("click", () => setAddCover(null));

  /* ===== 시트 ===== */
  let current = null;
  function openSheet(name, id) {
    if (current === "detail" && name !== "detail") { openId = null; editInfo = editReview = false; }
    if (current) $("#" + current + "Sheet").hidden = true;
    current = name;
    $("#scrim").hidden = false;
    $("#" + name + "Sheet").hidden = false;
    document.body.style.overflow = "hidden";
    if (name === "name") {
      $("#nameInput").value = me;
      renderNameChips();
    } else if (name === "add") {
      $("#addForm").reset();
      addEmojiPicked = false; setAddCover(null); renderAddPicker();
      setTimeout(() => $("#addTitleInput").focus(), 50);
    } else if (name === "detail") {
      openId = id; editInfo = false; editReview = false;
      $("#cmtInput").value = "";
      renderDetail();
      $("#detailBody").scrollTop = 0;
    }
  }
  function closeSheet() {
    if (!current) return;
    $("#" + current + "Sheet").hidden = true;
    $("#scrim").hidden = true;
    document.body.style.overflow = "";
    if (current === "name") afterName = null;
    if (current === "detail") { openId = null; editInfo = editReview = false; }
    current = null;
  }
  $("#scrim").addEventListener("click", closeSheet);
  document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeSheet));
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

  /* ===== 동작 ===== */
  const setDone = (id, done) => sb.from("bucket_items").update(done ? { done: true, done_at: today() } : { done: false, done_at: null }).eq("id", id);
  const setTrash = (id, on) => sb.from("bucket_items").update(on ? { deleted_at: new Date().toISOString(), deleted_by: me } : { deleted_at: null, deleted_by: null }).eq("id", id);

  async function markDone(id, btn) {
    if (needName()) return;
    const ok = await busy(btn, () => save(setDone(id, true)));
    if (ok) { toast("🎉 축하해요! 인증 사진과 후기를 남겨 보세요", 3500); openSheet("detail", id); }
  }
  async function markUndone(id, btn) {
    if (!confirm("달성 표시를 취소할까요?\n(사진과 후기는 그대로 남아요)")) return;
    await busy(btn, () => save(setDone(id, false), "도전 중으로 옮겼어요"));
  }
  async function restore(id, btn) {
    await busy(btn, () => save(setTrash(id, false), "되살렸어요"));
  }

  // 사진을 줄여서 올리고 저장소 안 경로를 돌려줌
  async function uploadPhoto(itemId, file, kind) {
    const blob = await shrink(file);
    const path = `${itemId}/${kind}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
    const up = await sb.storage.from(PHOTO_BUCKET).upload(path, blob, { contentType: "image/jpeg", upsert: false });
    if (up.error) throw up.error;
    return path;
  }

  $("#tabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if (!t) return;
    tab = t.dataset.tab; store.set("bucket.tab", tab); render(); window.scrollTo(0, 0);
  });

  $("#list").addEventListener("click", e => {
    const btn = e.target.closest("[data-act]"), card = e.target.closest(".card");
    if (!btn || !card) return;
    const id = Number(card.dataset.id), i = byId(id);
    if (!i) return;
    if (btn.dataset.act === "open") openSheet("detail", id);
    else if (btn.dataset.act === "check") i.done ? markUndone(id, btn) : markDone(id, btn);
    else if (btn.dataset.act === "restore") restore(id, btn);
  });

  document.addEventListener("click", e => {
    if (e.target.closest("#nameBtn")) openSheet("name");
    if (e.target.closest("#retryBtn")) { loadError = ""; render(); load(); }
  });

  $("#inviteBtn").addEventListener("click", async () => {
    const url = location.href.split("#")[0].split("?")[0];
    const data = { title: "우리들의 버킷리스트", text: "같이 하고 싶은 일, 여기에 적어 줘!", url };
    if (navigator.share) { try { await navigator.share(data); return; } catch (err) { if (err.name === "AbortError") return; } }
    try { await navigator.clipboard.writeText(url); toast("링크를 복사했어요. 친구에게 보내 주세요!"); }
    catch { prompt("이 링크를 복사해서 친구에게 보내 주세요", url); }
  });

  $("#addBtn").addEventListener("click", () => { if (!needName(() => openSheet("add"))) openSheet("add"); });

  $("#nameForm").addEventListener("submit", e => {
    e.preventDefault();
    const v = $("#nameInput").value.trim();
    if (!v) return;
    setName(v);
  });
  $("#nameChips").addEventListener("click", e => {
    const b = e.target.closest("[data-name]");
    if (b) setName(b.dataset.name);
  });

  $("#addForm").addEventListener("submit", async e => {
    e.preventDefault();
    const title = $("#addTitleInput").value.trim(), note = $("#addNoteInput").value.trim();
    if (!title) return;
    await busy(e.submitter, async () => {
      const ins = await sb.from("bucket_items").insert({ title, note: note || null, author: me, emoji: addEmoji || guessEmoji(title, hash(title)) }).select("id").single();
      if (ins.error) { toast("저장하지 못했어요. (" + ins.error.message + ")", 4500); return; }
      let msg = "버킷을 추가했어요 " + addEmoji;
      if (addCoverFile) {
        try {
          const path = await uploadPhoto(ins.data.id, addCoverFile, "cover");
          const r = await sb.from("bucket_items").update({ cover_path: path }).eq("id", ins.data.id);
          if (r.error) throw r.error;
        } catch (err) { msg = "버킷은 추가했는데 사진은 올리지 못했어요. (" + (err.message || err) + ")"; }
      }
      toast(msg, 3500);
      closeSheet();
      if (tab !== "todo") { tab = "todo"; store.set("bucket.tab", tab); }
      await load();
      window.scrollTo(0, 0);
    });
  });

  // 상세 시트 안의 버튼들
  $("#detailBody").addEventListener("click", async e => {
    const pick = e.target.closest("#infoForm [data-emoji]");
    if (pick) {
      const f = $("#infoForm");
      f.elements.iemoji.value = pick.dataset.emoji;
      f.querySelectorAll("[data-emoji]").forEach(b => b.setAttribute("aria-pressed", b === pick));
      return;
    }
    const btn = e.target.closest("button[data-act]");
    if (!btn || openId == null) return;
    const i = byId(openId); if (!i) return;
    const act = btn.dataset.act;
    if (act === "edit") { editInfo = true; infoForm(i); }
    else if (act === "cancel-edit") { editInfo = false; renderDetail(); }
    else if (act === "review") { editReview = true; reviewForm(i); }
    else if (act === "cancel-review") { editReview = false; renderDetail(); }
    else if (act === "done") markDone(i.id, btn);
    else if (act === "undone") markUndone(i.id, btn);
    else if (act === "restore") restore(i.id, btn);
    else if (act === "uncover") {
      if (!confirm("붙인 사진을 뗄까요?")) return;
      await busy(btn, () => save(sb.from("bucket_items").update({ cover_path: null }).eq("id", i.id), "사진을 뗐어요"));
    }
    else if (act === "trash") {
      if (!confirm(`'${i.title}'을(를) 휴지통으로 보낼까요?\n휴지통에서 언제든 되살릴 수 있어요.`)) return;
      if (needName()) return;
      const ok = await busy(btn, () => save(setTrash(i.id, true), "휴지통으로 보냈어요"));
      if (ok) closeSheet();
    }
    else if (act === "join") {
      if (needName()) return;
      const joined = joinsOf(i.id).some(j => j.name === me);
      await busy(btn, () => save(joined
        ? sb.from("bucket_joins").delete().eq("item_id", i.id).eq("name", me)
        : sb.from("bucket_joins").insert({ item_id: i.id, name: me }),
        joined ? "함께하기를 취소했어요" : "🙋 함께하기로 했어요!"));
    }
    else if (act === "delcmt") {
      const cid = Number(btn.closest("[data-cid]").dataset.cid);
      if (!confirm("이 댓글을 지울까요?")) return;
      await busy(btn, () => save(sb.from("bucket_comments").update({ deleted_at: new Date().toISOString() }).eq("id", cid), "댓글을 지웠어요"));
    }
  });

  $("#detailBody").addEventListener("submit", async e => {
    e.preventDefault();
    const f = e.target, i = byId(openId); if (!i) return;
    if (f.id === "infoForm") {
      const title = f.elements.ititle.value.trim(), note = f.elements.inote.value.trim(), emoji = f.elements.iemoji.value;
      if (!title) return;
      const ok = await busy(e.submitter, () => save(sb.from("bucket_items").update({ title, note: note || null, emoji: emoji || null }).eq("id", i.id), "고쳤어요"));
      if (ok) { editInfo = false; renderDetail(); }
    } else if (f.id === "reviewForm") {
      const note = f.elements.note.value.trim();
      const ok = await busy(e.submitter, () => save(sb.from("bucket_items").update({ done_note: note || null }).eq("id", i.id), "후기를 저장했어요"));
      if (ok) { editReview = false; renderDetail(); }
    } else if (f.id === "cmtForm") {
      if (needName()) return;
      const body = $("#cmtInput").value.trim();
      if (!body) return;
      const ok = await busy(e.submitter, () => save(sb.from("bucket_comments").insert({ item_id: i.id, author: me, body })));
      if (ok) { $("#cmtInput").value = ""; const b = $("#detailBody"); b.scrollTop = b.scrollHeight; }
    }
  });

  $("#detailBody").addEventListener("change", async e => {
    const el = e.target, i = byId(openId);
    if (!i || !el.dataset) return;
    const act = el.dataset.act;
    if (act === "date") {
      if (!el.value) { el.value = i.done_at || ""; return; }
      await save(sb.from("bucket_items").update({ done_at: el.value }).eq("id", i.id), "달성한 날을 바꿨어요");
    } else if ((act === "photo" || act === "cover") && el.files && el.files[0]) {
      if (needName()) return;
      const file = el.files[0];
      uploading = act; renderDetail();
      try {
        const path = await uploadPhoto(i.id, file, act);
        uploading = "";
        await save(sb.from("bucket_items").update(act === "cover" ? { cover_path: path } : { photo_path: path }).eq("id", i.id),
          act === "cover" ? "📷 사진을 붙였어요" : "📷 인증 사진을 올렸어요");
      } catch (err) {
        toast("사진을 올리지 못했어요. (" + (err.message || err) + ")", 4500);
      } finally {
        uploading = "";
        if (openId != null) renderDetail();
      }
    }
  });

  // 사진 줄이기: 긴 변 PHOTO_MAX px, JPEG
  async function shrink(file) {
    let src;
    try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); }
    catch {
      src = await new Promise((res, rej) => {
        const img = new Image(); img.onload = () => res(img);
        img.onerror = () => rej(new Error("이미지를 읽을 수 없어요"));
        img.src = URL.createObjectURL(file);
      });
    }
    const w = src.width, h = src.height, k = Math.min(1, PHOTO_MAX / Math.max(w, h));
    const c = document.createElement("canvas");
    c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.85));
    if (!blob) throw new Error("이미지를 변환할 수 없어요");
    return blob;
  }

  /* ===== 시작 ===== */
  render();
  load();
  if (sb) {
    // 친구가 바꾼 내용이 바로 보이도록
    const ch = sb.channel("bucket-all");
    ["bucket_items", "bucket_joins", "bucket_comments"].forEach(table =>
      ch.on("postgres_changes", { event: "*", schema: "public", table }, loadSoon));
    ch.subscribe();
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) loadSoon(); });
})();
</script>
</body>
</html>
