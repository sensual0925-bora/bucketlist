<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리들의 버킷리스트</title>
<meta name="description" content="친구들과 함께 쓰는 버킷리스트 일기장">
<meta name="theme-color" content="#D9573B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="버킷리스트">
<meta property="og:title" content="우리들의 버킷리스트">
<meta property="og:description" content="하고 싶은 일, 같이 적고 같이 해요">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&display=swap">
<style>
:root{
  color-scheme:light dark;
  --paper:#FFFDF6; --paper-line:#E4ECF4; --card:#FFFFFF; --surface-2:#F5EFE4;
  --ink:#3A2E28; --ink-2:#6E5F55; --ink-3:#A0918A;
  --rule:#EDE3D6; --rule-strong:#D9CBBB;
  --accent:#D9573B; --accent-ink:#FFFFFF; --accent-soft:#FBE3DA;
  --done:#2F7D5B; --done-soft:#DDEFE5; --crit:#B3382A; --stamp:#D23A2A;
  --hl:#FFE98A;
  --p0:#FFDCDC; --p1:#FFE6C9; --p2:#FFF3B8; --p3:#DAF2CF; --p4:#CFEDF3; --p5:#D7E1FF; --p6:#E6D9FF; --p7:#FFD9EC;
  --scrim:rgba(30,15,8,.42); --shadow:0 -10px 40px rgba(60,30,15,.18);
  --card-shadow:0 1px 2px rgba(80,50,30,.08),0 4px 14px rgba(80,50,30,.08);
  --hand:"Gaegu","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --pen:"Nanum Pen Script","Gaegu",cursive;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#1B1815; --paper-line:#26231F; --card:#24201C; --surface-2:#2E2924;
    --ink:#F0E8DC; --ink-2:#C2B4A5; --ink-3:#8E8073;
    --rule:#36302A; --rule-strong:#4A423A;
    --accent:#F08A6E; --accent-ink:#2A0F06; --accent-soft:#45251C;
    --done:#6FCB9F; --done-soft:#1C3A2C; --crit:#EE8474; --stamp:#F0705E;
    --hl:#6B5A1E;
    --p0:#5A3434; --p1:#5A4430; --p2:#57502C; --p3:#355233; --p4:#2E4D54; --p5:#343F63; --p6:#45385F; --p7:#583248;
    --scrim:rgba(0,0,0,.6); --shadow:0 -10px 40px rgba(0,0,0,.5);
    --card-shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font-family:var(--hand);font-size:18px;line-height:1.5;letter-spacing:-.04em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  background-color:var(--paper);
  background-image:repeating-linear-gradient(to bottom,transparent 0 33px,var(--paper-line) 33px 34px)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:640px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px));padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(120px + env(safe-area-inset-bottom,0px))}

/* 상단 */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.today{margin:0;color:var(--ink-3);font-size:16px}
h1{margin:0;font-family:var(--pen);font-weight:400;font-size:40px;line-height:1.15;letter-spacing:0}
.hl{background:linear-gradient(transparent 58%,var(--hl) 58%,var(--hl) 92%,transparent 92%);padding:0 2px}
.hello{margin:4px 0 0;color:var(--ink-2);font-size:17px}
.hello button{border:0;background:none;padding:0;color:var(--accent);font-weight:700;text-decoration:underline wavy;text-underline-offset:4px;text-decoration-thickness:1px}
.invite{flex:none;margin-top:6px;height:40px;padding:0 14px;border-radius:20px;border:1.5px dashed var(--rule-strong);background:var(--card);font-size:16px;font-weight:700}

.progress{margin:18px 0 0;background:var(--card);border-radius:4px;padding:12px 16px 14px;box-shadow:var(--card-shadow);position:relative}
.progress-line{display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:var(--ink-2)}
.progress-line b{font-family:var(--pen);font-weight:400;font-size:30px;color:var(--ink);line-height:1}
.bar{margin-top:8px;height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar > i{display:block;height:100%;width:0;border-radius:6px;transition:width .4s ease;
  background:repeating-linear-gradient(-45deg,var(--done) 0 8px,color-mix(in srgb,var(--done) 80%,#fff) 8px 16px)}

/* 탭: 일기장 인덱스 */
.tabs{display:flex;gap:6px;margin:20px 0 14px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:40px;padding:0 16px;border-radius:12px 12px 4px 4px;border:0;background:var(--surface-2);color:var(--ink-2);font-size:17px;font-weight:700}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tab .n{margin-left:4px;opacity:.8}

/* 목록: 일기장 한 칸 */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:18px}
.card{position:relative;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:4px;padding:16px 8px 14px 14px;box-shadow:var(--card-shadow);transform:rotate(var(--tilt,0deg))}
.tape{position:absolute;top:-9px;left:50%;width:74px;height:20px;transform:translateX(-50%) rotate(var(--tape,-3deg));background:var(--tc,var(--p2));opacity:.85;border-left:2px dotted rgba(255,255,255,.6);border-right:2px dotted rgba(255,255,255,.6)}
.sticker{flex:none;width:64px;height:64px;display:grid;place-items:center;border:3px solid #fff;border-radius:16px;background:var(--sc,var(--p2));font-size:34px;line-height:1;box-shadow:0 2px 6px rgba(80,50,30,.18);transform:rotate(var(--stilt,-4deg));padding:0}
@media (prefers-color-scheme: dark){ .sticker{border-color:#3A332C} }
.polaroid-mini{flex:none;width:68px;padding:4px 4px 12px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transform:rotate(var(--stilt,-4deg));border:0;position:relative}
.polaroid-mini img{display:block;width:60px;height:60px;object-fit:cover;background:#eee}
.polaroid-mini .em{position:absolute;right:-8px;bottom:-6px;font-size:22px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.card-main{flex:1;min-width:0;border:0;background:none;padding:2px 2px;text-align:left;display:block}
.card-main > span{display:block}
.c-title{font-size:21px;font-weight:700;line-height:1.3;word-break:break-word}
.card.done .c-title{text-decoration:line-through;text-decoration-color:var(--stamp);text-decoration-thickness:2px;color:var(--ink-2)}
.c-note{margin-top:2px;color:var(--ink-2);font-size:17px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.c-meta{margin-top:4px;display:flex!important;flex-wrap:wrap;gap:2px 10px;color:var(--ink-3);font-size:16px}
.c-done{color:var(--done);font-weight:700}
.check{flex:none;width:44px;height:44px;display:grid;place-items:center;border:0;background:none;padding:0;align-self:center}
.check i{width:28px;height:28px;border:2.5px solid var(--ink-2);border-radius:6px 8px 5px 7px;display:grid;place-items:center;transform:rotate(-3deg);color:var(--stamp)}
.check svg{width:30px;height:30px;opacity:0;margin:-6px -4px 0 0}
.card.done .check svg{opacity:1}
.stamp{position:absolute;top:6px;right:52px;transform:rotate(-14deg);border:2.5px solid var(--stamp);color:var(--stamp);border-radius:50%;width:58px;height:58px;display:grid;place-items:center;font-family:var(--pen);font-size:22px;line-height:1;opacity:.7;pointer-events:none}
.restore{flex:none;align-self:center;height:38px;padding:0 12px;border-radius:19px;border:1.5px solid var(--rule-strong);background:var(--card);font-size:16px;font-weight:700}

.empty{text-align:center;color:var(--ink-3);padding:48px 16px;font-size:18px;list-style:none}
.empty b{display:block;font-size:40px;margin-bottom:6px}
.err{background:var(--accent-soft);color:var(--ink);border-radius:8px;padding:14px 16px}
.err button{margin-top:8px}

/* 추가 버튼 */
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));height:54px;padding:0 28px;border-radius:27px;border:0;background:var(--accent);color:var(--accent-ink);font-size:20px;font-weight:700;box-shadow:0 6px 20px rgba(217,87,59,.35);z-index:10}

/* 공통 버튼 */
.btn{height:44px;padding:0 18px;border-radius:12px;border:1.5px solid var(--rule-strong);background:var(--card);font-weight:700;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{width:100%;height:54px;font-size:20px;border-radius:14px}
.btn.small{height:38px;padding:0 12px;font-size:16px;border-radius:10px}
.link{border:0;background:none;padding:4px 0;color:var(--ink-2);font-size:16px;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--crit)}
.file-btn{cursor:pointer}

/* 시트 */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;border-radius:18px 18px 0 0;max-height:92dvh;display:flex;flex-direction:column;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px);
  background-color:var(--paper);background-image:repeating-linear-gradient(to bottom,transparent 0 33px,var(--paper-line) 33px 34px)}
@media (min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:540px;border-radius:16px;max-height:88vh}
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 0;flex:none}
.sheet-head h2{margin:0;font-family:var(--pen);font-weight:400;font-size:32px}
.x{border:0;background:none;color:var(--ink-2);font-size:17px;height:40px;padding:0 4px}
.sheet-body{overflow-y:auto;padding:8px 16px 24px;overscroll-behavior:contain}
.field{display:block;margin:0 0 14px}
.field > span{display:block;font-size:16px;font-weight:700;color:var(--ink-2);margin-bottom:4px}
.input{width:100%;border:1.5px solid var(--rule-strong);background:var(--card);border-radius:10px;padding:10px 14px;font-size:18px}
textarea.input{resize:vertical;min-height:84px;line-height:1.45}
.hint{color:var(--ink-3);margin:0 0 14px;font-size:16px}
@media (prefers-reduced-motion: no-preference){
  .sheet{animation:up .2s ease-out}
  @media (min-width:700px){ .sheet{animation:none} }
}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}

/* 이모티콘 고르기 */
.pick-top{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.pick-top .sticker{width:72px;height:72px;font-size:40px}
.pick-top .hint{margin:0}
.picker{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:16px}
.picker button{aspect-ratio:1;border:0;border-radius:10px;background:transparent;font-size:24px;line-height:1;padding:0;display:grid;place-items:center}
.picker button[aria-pressed="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
@media (max-width:360px){ .picker{grid-template-columns:repeat(6,1fr)} }
.cover-row{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.cover-row img{width:56px;height:56px;object-fit:cover;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transform:rotate(3deg)}

/* 상세 */
.hero{display:flex;justify-content:center;padding:20px 0 4px}
.hero .sticker{width:110px;height:110px;font-size:62px;border-width:4px;border-radius:24px}
.polaroid{margin:0 auto;width:min(78%,320px);background:#fff;padding:10px 10px 14px;box-shadow:0 3px 12px rgba(0,0,0,.18);transform:rotate(var(--stilt,-2deg));position:relative}
.polaroid img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#eee}
.polaroid figcaption{margin-top:8px;font-family:var(--pen);font-size:22px;color:#3A2E28;text-align:center;line-height:1.2;word-break:break-word}
.polaroid .em{position:absolute;right:-12px;top:-14px;font-size:40px;line-height:1;transform:rotate(12deg);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
.polaroid .tape{top:-10px}
.hero-actions{display:flex;justify-content:center;gap:8px;margin:12px 0 0;flex-wrap:wrap}
.d-date{margin:14px 0 0;color:var(--ink-3);font-size:16px}
#dInfo h2{margin:0;font-family:var(--pen);font-weight:400;font-size:36px;line-height:1.15;word-break:break-word}
.d-note{margin:6px 0 0;white-space:pre-wrap;word-break:break-word;font-size:19px;line-height:34px}
.d-meta{margin:8px 0 0;color:var(--ink-3);font-size:16px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.d-sec{margin-top:18px;padding-top:14px;border-top:2px dashed var(--rule-strong)}
.d-sec h3{margin:0 0 8px;font-size:18px;color:var(--ink-2);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{background:var(--surface-2);border-radius:14px;padding:2px 12px;font-size:17px}
.chip.me{background:var(--accent-soft);color:var(--accent);font-weight:700}
.muted{color:var(--ink-3)}
.join-btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.done-box{background:color-mix(in srgb,var(--done-soft) 85%,transparent);border-radius:10px;padding:14px}
.done-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.badge{border:2px solid var(--stamp);color:var(--stamp);border-radius:8px;padding:0 9px;font-weight:700;transform:rotate(-4deg)}
.done-date{display:flex;align-items:center;gap:6px;color:var(--ink-2)}
.done-date input{border:1.5px solid var(--rule-strong);background:var(--card);border-radius:8px;padding:2px 8px;font-size:16px}
.done-head .link{margin-left:auto}
.done-box .polaroid{margin-top:20px}
.photo-drop{margin-top:12px;display:flex;align-items:center;justify-content:center;gap:8px;height:96px;border:2px dashed var(--rule-strong);border-radius:12px;background:var(--card);color:var(--ink-2);font-weight:700;cursor:pointer}
.photo-row{margin-top:12px;display:flex;justify-content:center}
.review{margin:12px 0 0;white-space:pre-wrap;word-break:break-word;font-size:19px}
.review-form{margin-top:12px}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.cmts{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:12px}
.cmt-top{display:flex;gap:8px;align-items:baseline;font-size:15px;color:var(--ink-3)}
.cmt-top b{color:var(--ink);font-size:17px}
.cmt-top .link{margin-left:auto;font-size:14px;padding:0}
.cmt p{margin:0;white-space:pre-wrap;word-break:break-word}
.cmt-form{display:flex;gap:8px}
.cmt-form .input{flex:1;min-width:0}
.trash-note{background:var(--surface-2);border-radius:12px;padding:12px 14px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;z-index:40;font-size:17px;max-width:calc(100% - 32px);text-align:center}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <div>
      <p class="today" id="today"></p>
      <h1><span class="hl">우리들의 버킷리스트</span></h1>
      <p class="hello" id="hello"></p>
    </div>
    <button class="invite" id="inviteBtn" type="button">💌 친구 초대</button>
  </div>

  <div class="progress" id="progress" hidden>
    <div class="progress-line"><span>함께 이룬 꿈</span><span><b id="doneCount">0</b> / <span id="allCount">0</span>개</span></div>
    <div class="bar"><i id="barFill"></i></div>
  </div>

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="todo">도전 중<span class="n" id="nTodo"></span></button>
    <button class="tab" role="tab" data-tab="done">달성<span class="n" id="nDone"></span></button>
    <button class="tab" role="tab" data-tab="trash">휴지통<span class="n" id="nTrash"></span></button>
  </div>

  <div id="status"></div>
  <ul class="list" id="list"></ul>
</main>

<button class="fab" id="addBtn" type="button">✏️ 버킷 쓰기</button>

<div class="scrim" id="scrim" hidden></div>

<!-- 이름 -->
<div class="sheet" id="nameSheet" role="dialog" aria-modal="true" aria-labelledby="nameTitle" hidden>
  <div class="sheet-head"><h2 id="nameTitle">이름을 알려주세요</h2><button class="x" type="button" data-close id="nameClose">닫기</button></div>
  <form class="sheet-body" id="nameForm">
    <p class="hint">버킷을 쓰거나 댓글을 달 때 이 이름이 보여요. 이 기기에 기억해 둘게요.</p>
    <label class="field"><span>이름 (친구들이 알아볼 수 있게)</span><input class="input" id="nameInput" maxlength="20" autocomplete="nickname" required></label>
    <button class="btn primary big" type="submit">시작하기</button>
  </form>
</div>

<!-- 추가 -->
<div class="sheet" id="addSheet" role="dialog" aria-modal="true" aria-labelledby="addTitle" hidden>
  <div class="sheet-head"><h2 id="addTitle">새 버킷 쓰기</h2><button class="x" type="button" data-close>닫기</button></div>
  <form class="sheet-body" id="addForm">
    <label class="field"><span>하고 싶은 일</span><input class="input" id="addTitleInput" name="title" maxlength="100" placeholder="예) 제주도 한 바퀴 자전거 여행" required autocomplete="off"></label>
    <label class="field"><span>설명 (선택)</span><textarea class="input" id="addNoteInput" maxlength="1000" placeholder="언제, 누구랑, 왜 하고 싶은지"></textarea></label>
    <div class="field"><span>스티커</span><div id="addPicker"></div></div>
    <div class="field"><span>사진 붙이기 (선택)</span>
      <div class="cover-row"><img id="addCoverPreview" alt="" hidden>
        <label class="btn small file-btn"><span id="addCoverLabel">📷 사진 고르기</span><input type="file" accept="image/*" id="addCover" hidden></label>
        <button class="link" type="button" id="addCoverClear" hidden>빼기</button></div>
    </div>
    <button class="btn primary big" type="submit">일기장에 붙이기</button>
  </form>
</div>

<!-- 상세 -->
<div class="sheet" id="detailSheet" role="dialog" aria-modal="true" aria-label="버킷 자세히" hidden>
  <div class="sheet-head"><span></span><button class="x" type="button" data-close>닫기</button></div>
  <div class="sheet-body" id="detailBody">
    <section id="dHero"></section>
    <section id="dInfo"></section>
    <section class="d-sec" id="dJoin"></section>
    <section class="d-sec" id="dDone"></section>
    <section class="d-sec">
      <h3>댓글 <span id="dCmtCount"></span></h3>
      <ul class="cmts" id="dComments"></ul>
      <form class="cmt-form" id="cmtForm">
        <input class="input" id="cmtInput" maxlength="500" placeholder="댓글 달기" autocomplete="off" aria-label="댓글">
        <button class="btn primary" type="submit">등록</button>
      </form>
    </section>
    <section class="d-sec" id="dFoot"></section>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script>
(() => {
  /* ===== Supabase 설정 ===== */
  // publishable 키는 웹페이지에 넣어 쓰도록 만든 공개용 키 (secret 키는 절대 넣지 말 것)
  const SUPABASE_URL = "https://pxbbwatboylajmxeqnqd.supabase.co";

  const fmtShort = iso => { const d = new Date(iso); return isNaN(d) ? "" : `${d.getMonth()+1}월 ${d.getDate()}일`; };

  /* ===== 일기장 꾸미기: 이모티콘 스티커 ===== */
  // 제목에 들어 있는 낱말로 스티커를 골라 줌 (앞에 있는 줄이 먼저)
  const EMOJI_RULES = `

    자전거,라이딩:🚲|캠핑,글램핑,텐트:🏕️|낚시:🎣|스키,보드타기:⛷️|서핑:🏄|스쿠버,다이빙,스노클:🤿|수영:🏊
    마라톤,달리기,러닝,조깅:🏃|요가,필라테스:🧘|헬스,운동,근육,바디프로필:💪|스카이다이빙,패러글라이딩,번지:🪂|열기구:🎈
    축구:⚽|야구:⚾|농구:🏀|골프:⛳|테니스:🎾|볼링:🎳|클라이밍:🧗|춤,댄스,발레:💃|노래방,노래,콘서트,공연,페스티벌:🎤
    통기타,기타 배우,기타 치,우쿨렐레:🎸|피아노:🎹|그림,드로잉,수채화:🎨|사진,필름카메라:📷|영화:🎬|뮤지컬,연극:🎭|책,독서,소설:📚|일기,글쓰기,편지:💌

    사우나,찜질방,온천,스파:♨️|치맥,치킨:🍗|맥주,술자리,술 한잔,포차,칵테일:🍻|와인:🍷|커피,카페:☕|빵,베이커리:🥐|케이크,디저트:🍰
    아이스크림:🍦|라면,국수,맛집,먹방:🍜|초밥,스시,오마카세:🍣|고기,바베큐,삼겹살:🥩|피자:🍕|요리,베이킹:🍳
    피크닉,소풍:🧺|한강:🌉|제주,귤:🍊|바다,해변,바닷가:🌊|섬,몰디브,발리,하와이:🏝️|크루즈,유람선,요트:🛳️
    벚꽃,꽃구경,꽃:🌸|단풍,가을:🍁|눈사람,크리스마스,겨울:⛄|숲,나무,캠프파이어:🌲|식물,화분,텃밭:🪴
    강아지,댕댕:🐶|고양이,냥:🐱|동물원,동물:🐾|생일,파티:🎉|결혼,웨딩,프러포즈:💍|이사,집,인테리어:🏡
    드라이브,자동차,운전,면허:🚗|기차,KTX,기차여행:🚆|우주,로켓:🚀|돈,저축,적금,부자:💰|다이어트,샐러드:🥗|봉사,기부:🤝
    쇼핑:🛍️|뜨개,뜨개질:🧶|도자기,공방:🏺|가족,엄마,아빠,부모님:👨‍👩‍👧|친구,우정:👯|데이트,연애,사랑:💕
    일본,도쿄,오사카,후쿠오카:🗾|파리,에펠탑:🗼|유럽,런던,스위스,이탈리아:🏰|미국,뉴욕:🗽|비행기,해외,세계일주,유학:✈️|여행,배낭:🧳`
    .trim().split(/[|\n]/).map(s => s.trim()).filter(Boolean).map(s => {
      const i = s.lastIndexOf(":"); return [s.slice(0, i).split(",").map(k => k.trim().toLowerCase()), s.slice(i + 1)];
    });
  const CUTE = ["🌈", "⭐", "🍀", "🌷", "🦋", "🌙", "🎈", "✨"];
  const PICKS = ["✈️","🧳","🌊","🏝️","⛰️","🥾","🏕️","🚲","🌌","🌸","🍁","⛄","🍗","🍻","☕","🍰","🍜","🎤","🎬","🎨","📷","📚","💪","🎢","🎮","💌","🎉","🐶","🏡","💰","🌈","✨"];
  function guessEmoji(title, seed = 0) {
    const t = String(title || "").toLowerCase();
    for (const [keys, e] of EMOJI_RULES) if (keys.some(k => k && t.includes(k))) return e;
    return CUTE[Math.abs(seed) % CUTE.length];
  }
  const hash = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.codePointAt(0)) | 0; return Math.abs(h); };
  const emojiOf = i => i.emoji || guessEmoji(i.title, hash(i.title));
  // 항목마다 정해진 색·기울기 (매번 같은 모양으로 보이게 id로 정함)

  };

  function pickerHtml(selected, suggested) {

    return `<div class="picker" role="group" aria-label="스티커 고르기">${list.map(e =>
      `<button type="button" data-emoji="${esc(e)}" aria-pressed="${e === selected}">${esc(e)}</button>`).join("")}</div>`;
  }

  /* ===== 상태 ===== */
  let me = store.get("bucket.name");

  /* ===== 불러오기 ===== */
  let loadSeq = 0;
  async function load() {
    if (!sb) { loadError = "Supabase 연결 파일을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요."; render(); return; }
    const seq = ++loadSeq;
    const [a, b, c] = await Promise.all([
      sb.from("bucket_items").select("*").order("created_at", { ascending: false }),
      sb.from("bucket_joins").select("*").order("created_at"),
      sb.from("bucket_comments").select("*").is("deleted_at", null).order("created_at"),
    ]);
    if (seq !== loadSeq) return;  // 더 최근 요청이 있으면 그 결과를 씀
    const err = a.error || b.error || c.error;
    if (err) { loadError = "목록을 불러오지 못했어요. (" + err.message + ")"; render(); return; }
    items = a.data; joins = b.data; comments = c.data;
    loaded = true; loadError = "";
    render();
    if (openId != null) renderDetail();
  }
  let loadTimer = null;
  const loadSoon = () => { clearTimeout(loadTimer); loadTimer = setTimeout(load, 300); };

  // 저장 공통: 실패하면 알리고, 성공하면 다시 불러옴
  async function save(query, okMsg) {
    const { error } = await query;
    if (error) { toast("저장하지 못했어요. (" + error.message + ")", 4500); return false; }
    if (okMsg) toast(okMsg);
    await load();
    return true;
  }
  async function busy(btn, fn) {
    if (btn) btn.disabled = true;
    try { return await fn(); } finally { if (btn) btn.disabled = false; }
  }
  function needName() {
    if (me) return false;

    return true;

  /* ===== 목록 그리기 ===== */
  function render() {
    $("#today").textContent = "📔 " + fmtDiary(new Date());

      ? `<button type="button" id="nameBtn">${esc(me)}</button>님, 오늘은 어떤 꿈을 적어 볼까요?`
      : "친구들과 하고 싶은 일을 함께 적어요";
    const live = items.filter(i => !i.deleted_at);
    const done = live.filter(i => i.done);
    const trash = items.filter(i => i.deleted_at);
    $("#progress").hidden = !loaded || !live.length;
    $("#doneCount").textContent = done.length;
    $("#allCount").textContent = live.length;
    $("#barFill").style.width = live.length ? (done.length / live.length * 100) + "%" : "0";
    $("#nTodo").textContent = loaded ? live.length - done.length : "";
    $("#nDone").textContent = loaded ? done.length : "";
    $("#nTrash").textContent = loaded && trash.length ? trash.length : "";
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.tab === tab));
    $("#addBtn").hidden = tab === "trash";

    const status = $("#status"), list = $("#list");
    if (loadError) {
      status.innerHTML = `<div class="err">${esc(loadError)}<br><button class="btn small" type="button" id="retryBtn">다시 시도</button></div>`;
      if (!loaded) { list.innerHTML = ""; return; }
    } else status.innerHTML = loaded ? "" : `<p class="empty">일기장 펼치는 중…</p>`;
    if (!loaded) { list.innerHTML = ""; return; }

    let rows;
    if (tab === "todo") rows = live.filter(i => !i.done);
    else if (tab === "done") rows = done.slice().sort((x, y) => (y.done_at || "").localeCompare(x.done_at || "") || y.created_at.localeCompare(x.created_at));
    else rows = trash.slice().sort((x, y) => y.deleted_at.localeCompare(x.deleted_at));

    if (!rows.length) {
      list.innerHTML = `<li class="empty">${
        tab === "todo" ? (live.length ? "<b>🎉</b>모두 이뤘어요! 새로운 꿈을 적어 볼까요?" : "<b>📔</b>아직 빈 일기장이에요.<br>아래 <strong>✏️ 버킷 쓰기</strong>로 첫 번째 꿈을 적어 보세요.")

        : "휴지통이 비어 있어요."}</li>`;
      return;
    }
    list.innerHTML = rows.map(cardHtml).join("");

  // 카드 왼쪽 그림: 인증 사진 > 붙인 사진 > 이모티콘 스티커
  function artHtml(i) {
    const pic = (i.done && i.photo_path) || i.cover_path;
    if (pic) return `<button class="polaroid-mini" type="button" data-act="open" aria-label="${esc(i.title)} 자세히"><img src="${esc(photoUrl(pic))}" alt="" loading="lazy"><span class="em">${esc(emojiOf(i))}</span></button>`;
    return `<button class="sticker" type="button" data-act="open" aria-label="${esc(i.title)} 자세히">${esc(emojiOf(i))}</button>`;
  }

  function cardHtml(i) {
    const nJoin = joinsOf(i.id).length, nCmt = commentsOf(i.id).length;
    const meta = [
      `<span>${esc(i.author)}</span>`,
      i.done ? `<span class="c-done">${esc(fmtDay(i.done_at))} 달성</span>` : `<span>${esc(fmtShort(i.created_at))}</span>`,
      nJoin ? `<span>🙋 ${nJoin}</span>` : "",
      nCmt ? `<span>💬 ${nCmt}</span>` : "",
      i.deleted_at ? `<span>${esc(i.deleted_by || "누군가")}님이 ${esc(fmtAgo(i.deleted_at))} 지움</span>` : "",
    ].join("");
    const main = `<button class="card-main" type="button" data-act="open">
        <span class="c-title">${esc(i.title)}</span>
        ${i.note ? `<span class="c-note">${esc(i.note)}</span>` : ""}
        <span class="c-meta">${meta}</span>
      </button>`;
    const head = `<li class="card${i.done ? " done" : ""}${i.deleted_at ? " trash" : ""}" data-id="${i.id}" style="${look(i.id)}"><span class="tape" aria-hidden="true"></span>${artHtml(i)}${main}`;
    if (i.deleted_at) return `${head}<button class="restore" type="button" data-act="restore">되살리기</button></li>`;
    return `${head}
      ${i.done ? `<span class="stamp" aria-hidden="true">달성!</span>` : ""}

    </li>`;

              : deleted ? "" : `<label class="photo-drop">📷 인증 사진 올리기${file("photo")}</label>`}
            ${i.done_note ? `<p class="review">${esc(i.done_note)}</p>` : ""}
            ${deleted ? "" : `<div class="row" style="justify-content:flex-start"><button class="link" type="button" data-act="review">${i.done_note ? "후기 고치기" : "✏️ 후기 남기기"}</button></div>`}
          </div>`;
      }
    }

    const cs = commentsOf(i.id);
    $("#dCmtCount").textContent = cs.length ? cs.length : "";
    $("#dComments").innerHTML = cs.length ? cs.map(c => `
      <li class="cmt" data-cid="${c.id}">
        <div class="cmt-top"><b>${esc(c.author)}</b><span>${esc(fmtAgo(c.created_at))}</span>
          ${c.author === me ? `<button class="link" type="button" data-act="delcmt">삭제</button>` : ""}</div>
        <p>${esc(c.body)}</p>
      </li>`).join("") : `<li class="muted">첫 댓글을 남겨 보세요.</li>`;

    $("#dFoot").innerHTML = deleted
      ? `<div class="trash-note"><span>휴지통에 있는 버킷이에요.</span><button class="btn small" type="button" data-act="restore">되살리기</button></div>`
      : `<button class="link danger" type="button" data-act="trash">휴지통으로 보내기</button>`;
  }

  function infoForm(i) {
    const cur = emojiOf(i);
    $("#dInfo").innerHTML = `
      <form id="infoForm">
        <label class="field"><span>하고 싶은 일</span><input class="input" name="ititle" maxlength="100" required value="${esc(i.title)}"></label>
        <label class="field"><span>설명</span><textarea class="input" name="inote" maxlength="1000">${esc(i.note || "")}</textarea></label>
        <div class="field"><span>스티커</span>${pickerHtml(cur, guessEmoji(i.title, hash(i.title)))}</div>
        <input type="hidden" name="iemoji" value="${esc(cur)}">
        <div class="row"><button class="btn small" type="button" data-act="cancel-edit">취소</button><button class="btn small primary" type="submit">저장</button></div>
      </form>`;
    $("#infoForm").elements.ititle.focus();
  }
  function reviewForm(i) {
    $("#dDone").querySelector(".done-box").insertAdjacentHTML("beforeend", `
      <form class="review-form" id="reviewForm">
        <textarea class="input" name="note" maxlength="1000" placeholder="해 보니 어땠나요?">${esc(i.done_note || "")}</textarea>
        <div class="row"><button class="btn small" type="button" data-act="cancel-review">취소</button><button class="btn small primary" type="submit">저장</button></div>
      </form>`);
    const box = $("#dDone"), old = box.querySelector(".review"), btnRow = box.querySelector("[data-act=review]");
    if (old) old.hidden = true;
    if (btnRow) btnRow.parentElement.hidden = true;
    $("#reviewForm").elements.note.focus();
  }

  /* ===== 버킷 쓰기: 스티커 추천 + 사진 ===== */
  let addEmoji = "", addEmojiPicked = false, addCoverFile = null, addCoverUrl = "";
  function renderAddPicker() {
    const title = $("#addTitleInput").value;
    const suggested = guessEmoji(title, hash(title));
    if (!addEmojiPicked) addEmoji = suggested;
    $("#addPicker").innerHTML = `
      <div class="pick-top"><span class="sticker" style="--sc:var(--p2)">${esc(addEmoji)}</span>
        <p class="hint">${addEmojiPicked ? "직접 고른 스티커예요." : "제목에 맞춰 골라 봤어요. 다른 걸 눌러 바꿀 수 있어요."}</p></div>
      ${pickerHtml(addEmoji, suggested)}`;
  }
  function setAddCover(file) {
    if (addCoverUrl) URL.revokeObjectURL(addCoverUrl);
    addCoverFile = file; addCoverUrl = file ? URL.createObjectURL(file) : "";
    $("#addCoverPreview").hidden = !file;
    if (file) $("#addCoverPreview").src = addCoverUrl;
    $("#addCoverClear").hidden = !file;
    $("#addCoverLabel").textContent = file ? "📷 다른 사진" : "📷 사진 고르기";
  }
  $("#addTitleInput").addEventListener("input", renderAddPicker);
  $("#addPicker").addEventListener("click", e => {
    const b = e.target.closest("[data-emoji]"); if (!b) return;
    addEmoji = b.dataset.emoji; addEmojiPicked = true; renderAddPicker();
  });
  $("#addCover").addEventListener("change", e => { if (e.target.files[0]) setAddCover(e.target.files[0]); e.target.value = ""; });
  $("#addCoverClear").addEventListener("click", () => setAddCover(null));

  /* ===== 시트 ===== */
  let current = null;
  function openSheet(name, id) {
    if (current === "detail" && name !== "detail") { openId = null; editInfo = editReview = false; }
    if (current) $("#" + current + "Sheet").hidden = true;
    current = name;
    $("#scrim").hidden = false;
    $("#" + name + "Sheet").hidden = false;
    document.body.style.overflow = "hidden";
    if (name === "name") {
      $("#nameInput").value = me;
      $("#nameClose").hidden = !me;          // 이름이 없으면 닫을 수 없음
      setTimeout(() => $("#nameInput").focus(), 50);
    } else if (name === "add") {
      $("#addForm").reset();
      addEmojiPicked = false; setAddCover(null); renderAddPicker();
      setTimeout(() => $("#addTitleInput").focus(), 50);
    } else if (name === "detail") {
      openId = id; editInfo = false; editReview = false;
      $("#cmtInput").value = "";
      renderDetail();
      $("#detailBody").scrollTop = 0;
    }
  }
  function closeSheet() {
    if (!current) return;
    if (current === "name" && !me) return;
    $("#" + current + "Sheet").hidden = true;
    $("#scrim").hidden = true;
    document.body.style.overflow = "";
    if (current === "detail") { openId = null; editInfo = editReview = false; }
    current = null;
  }
  $("#scrim").addEventListener("click", closeSheet);
  document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeSheet));
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

  /* ===== 동작 ===== */
  const setDone = (id, done) => sb.from("bucket_items").update(done ? { done: true, done_at: today() } : { done: false, done_at: null }).eq("id", id);
  const setTrash = (id, on) => sb.from("bucket_items").update(on ? { deleted_at: new Date().toISOString(), deleted_by: me } : { deleted_at: null, deleted_by: null }).eq("id", id);

  async function markDone(id, btn) {
    if (needName()) return;
    const ok = await busy(btn, () => save(setDone(id, true)));
    if (ok) { toast("🎉 축하해요! 인증 사진과 후기를 남겨 보세요", 3500); openSheet("detail", id); }
  }
  async function markUndone(id, btn) {
    if (!confirm("달성 표시를 취소할까요?\n(사진과 후기는 그대로 남아요)")) return;
    await busy(btn, () => save(setDone(id, false), "도전 중으로 옮겼어요"));
  }
  async function restore(id, btn) {
    await busy(btn, () => save(setTrash(id, false), "되살렸어요"));
  }

  // 사진을 줄여서 올리고 저장소 안 경로를 돌려줌
  async function uploadPhoto(itemId, file, kind) {
    const blob = await shrink(file);
    const path = `${itemId}/${kind}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}.jpg`;
    const up = await sb.storage.from(PHOTO_BUCKET).upload(path, blob, { contentType: "image/jpeg", upsert: false });
    if (up.error) throw up.error;
    return path;
  }

  $("#tabs").addEventListener("click", e => {
    const t = e.target.closest(".tab"); if (!t) return;
    tab = t.dataset.tab; store.set("bucket.tab", tab); render(); window.scrollTo(0, 0);
  });

  $("#list").addEventListener("click", e => {
    const btn = e.target.closest("[data-act]"), card = e.target.closest(".card");
    if (!btn || !card) return;
    const id = Number(card.dataset.id), i = byId(id);
    if (!i) return;
    if (btn.dataset.act === "open") openSheet("detail", id);
    else if (btn.dataset.act === "check") i.done ? markUndone(id, btn) : markDone(id, btn);
    else if (btn.dataset.act === "restore") restore(id, btn);
  });

  document.addEventListener("click", e => {
    if (e.target.closest("#nameBtn")) openSheet("name");
    if (e.target.closest("#retryBtn")) { loadError = ""; render(); load(); }
  });

  $("#inviteBtn").addEventListener("click", async () => {
    const url = location.href.split("#")[0].split("?")[0];
    const data = { title: "우리들의 버킷리스트", text: "같이 하고 싶은 일, 여기에 적어 줘!", url };
    if (navigator.share) { try { await navigator.share(data); return; } catch (err) { if (err.name === "AbortError") return; } }
    try { await navigator.clipboard.writeText(url); toast("링크를 복사했어요. 친구에게 보내 주세요!"); }
    catch { prompt("이 링크를 복사해서 친구에게 보내 주세요", url); }
  });

  $("#addBtn").addEventListener("click", () => { if (!needName()) openSheet("add"); });

  $("#nameForm").addEventListener("submit", e => {
    e.preventDefault();
    const v = $("#nameInput").value.trim();
    if (!v) return;
    me = v; store.set("bucket.name", v);
    closeSheet(); render();
    toast(`반가워요, ${v}님!`);
  });

  $("#addForm").addEventListener("submit", async e => {
    e.preventDefault();
    const title = $("#addTitleInput").value.trim(), note = $("#addNoteInput").value.trim();
    if (!title) return;
    await busy(e.submitter, async () => {
      const ins = await sb.from("bucket_items").insert({ title, note: note || null, author: me, emoji: addEmoji || guessEmoji(title, hash(title)) }).select("id").single();
      if (ins.error) { toast("저장하지 못했어요. (" + ins.error.message + ")", 4500); return; }
      let msg = "일기장에 붙였어요 " + addEmoji;
      if (addCoverFile) {
        try {
          const path = await uploadPhoto(ins.data.id, addCoverFile, "cover");
          const r = await sb.from("bucket_items").update({ cover_path: path }).eq("id", ins.data.id);
          if (r.error) throw r.error;
        } catch (err) { msg = "버킷은 붙였는데 사진은 올리지 못했어요. (" + (err.message || err) + ")"; }
      }
      toast(msg, 3500);
      closeSheet();
      if (tab !== "todo") { tab = "todo"; store.set("bucket.tab", tab); }
      await load();
      window.scrollTo(0, 0);
    });
  });

  // 상세 시트 안의 버튼들
  $("#detailBody").addEventListener("click", async e => {
    const pick = e.target.closest("#infoForm [data-emoji]");
    if (pick) {
      const f = $("#infoForm");
      f.elements.iemoji.value = pick.dataset.emoji;
      f.querySelectorAll("[data-emoji]").forEach(b => b.setAttribute("aria-pressed", b === pick));
      return;
    }
    const btn = e.target.closest("button[data-act]");
    if (!btn || openId == null) return;
    const i = byId(openId); if (!i) return;
    const act = btn.dataset.act;
    if (act === "edit") { editInfo = true; infoForm(i); }
    else if (act === "cancel-edit") { editInfo = false; renderDetail(); }
    else if (act === "review") { editReview = true; reviewForm(i); }
    else if (act === "cancel-review") { editReview = false; renderDetail(); }
    else if (act === "done") markDone(i.id, btn);
    else if (act === "undone") markUndone(i.id, btn);
    else if (act === "restore") restore(i.id, btn);
    else if (act === "uncover") {
      if (!confirm("붙인 사진을 뗄까요?")) return;
      await busy(btn, () => save(sb.from("bucket_items").update({ cover_path: null }).eq("id", i.id), "사진을 뗐어요"));
    }
    else if (act === "trash") {
      if (!confirm(`'${i.title}'을(를) 휴지통으로 보낼까요?\n휴지통에서 언제든 되살릴 수 있어요.`)) return;
      if (needName()) return;
      const ok = await busy(btn, () => save(setTrash(i.id, true), "휴지통으로 보냈어요"));
      if (ok) closeSheet();
    }
    else if (act === "join") {
      if (needName()) return;
      const joined = joinsOf(i.id).some(j => j.name === me);
      await busy(btn, () => save(joined
        ? sb.from("bucket_joins").delete().eq("item_id", i.id).eq("name", me)
        : sb.from("bucket_joins").insert({ item_id: i.id, name: me }),
        joined ? "함께하기를 취소했어요" : "🙋 함께하기로 했어요!"));
    }
    else if (act === "delcmt") {
      const cid = Number(btn.closest("[data-cid]").dataset.cid);
      if (!confirm("이 댓글을 지울까요?")) return;
      await busy(btn, () => save(sb.from("bucket_comments").update({ deleted_at: new Date().toISOString() }).eq("id", cid), "댓글을 지웠어요"));
    }
  });

  $("#detailBody").addEventListener("submit", async e => {
    e.preventDefault();
    const f = e.target, i = byId(openId); if (!i) return;
    if (f.id === "infoForm") {
      const title = f.elements.ititle.value.trim(), note = f.elements.inote.value.trim(), emoji = f.elements.iemoji.value;
      if (!title) return;
      const ok = await busy(e.submitter, () => save(sb.from("bucket_items").update({ title, note: note || null, emoji: emoji || null }).eq("id", i.id), "고쳤어요"));
      if (ok) { editInfo = false; renderDetail(); }
    } else if (f.id === "reviewForm") {
      const note = f.elements.note.value.trim();
      const ok = await busy(e.submitter, () => save(sb.from("bucket_items").update({ done_note: note || null }).eq("id", i.id), "후기를 저장했어요"));
      if (ok) { editReview = false; renderDetail(); }
    } else if (f.id === "cmtForm") {
      if (needName()) return;
      const body = $("#cmtInput").value.trim();
      if (!body) return;
      const ok = await busy(e.submitter, () => save(sb.from("bucket_comments").insert({ item_id: i.id, author: me, body })));
      if (ok) { $("#cmtInput").value = ""; const b = $("#detailBody"); b.scrollTop = b.scrollHeight; }
    }
  });

  $("#detailBody").addEventListener("change", async e => {
    const el = e.target, i = byId(openId);
    if (!i || !el.dataset) return;
    const act = el.dataset.act;
    if (act === "date") {
      if (!el.value) { el.value = i.done_at || ""; return; }
      await save(sb.from("bucket_items").update({ done_at: el.value }).eq("id", i.id), "달성한 날을 바꿨어요");
    } else if ((act === "photo" || act === "cover") && el.files && el.files[0]) {
      if (needName()) return;
      const file = el.files[0];
      uploading = act; renderDetail();
      try {
        const path = await uploadPhoto(i.id, file, act);
        uploading = "";
        await save(sb.from("bucket_items").update(act === "cover" ? { cover_path: path } : { photo_path: path }).eq("id", i.id),
          act === "cover" ? "📷 사진을 붙였어요" : "📷 인증 사진을 올렸어요");
      } catch (err) {
        toast("사진을 올리지 못했어요. (" + (err.message || err) + ")", 4500);
      } finally {
        uploading = "";
        if (openId != null) renderDetail();
      }
    }
  });

  // 사진 줄이기: 긴 변 PHOTO_MAX px, JPEG
  async function shrink(file) {
    let src;
    try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); }
    catch {
      src = await new Promise((res, rej) => {
        const img = new Image(); img.onload = () => res(img);
        img.onerror = () => rej(new Error("이미지를 읽을 수 없어요"));
        img.src = URL.createObjectURL(file);
      });
    }
    const w = src.width, h = src.height, k = Math.min(1, PHOTO_MAX / Math.max(w, h));
    const c = document.createElement("canvas");
    c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.85));
    if (!blob) throw new Error("이미지를 변환할 수 없어요");
    return blob;
  }

  /* ===== 시작 ===== */
  render();
  load();
  if (!me) openSheet("name");
  if (sb) {
    // 친구가 바꾼 내용이 바로 보이도록
    const ch = sb.channel("bucket-all");
    ["bucket_items", "bucket_joins", "bucket_comments"].forEach(table =>
      ch.on("postgres_changes", { event: "*", schema: "public", table }, loadSoon));
    ch.subscribe();
  }
  document.addEventListener("visibilitychange", () => { if (!document.hidden) loadSoon(); });
})();
</script>
</body>
</html>
